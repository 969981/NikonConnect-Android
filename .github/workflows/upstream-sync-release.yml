name: Upstream sync and automatic test release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if the upstream commit has not changed
        type: boolean
        default: true
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/upstream-sync-release.yml'

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream changes safely
        id: check
        env:
          UPSTREAM_REPO: LAMYW-code/NikonConnect-Android
          UPSTREAM_BRANCH: master
          TARGET_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already synchronized."
          else
            git merge --no-edit -m "chore: sync upstream $upstream_sha" "$upstream_sha"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Test and build installable test-signed APK
        run: |
          chmod +x ./gradlew
          ./gradlew test :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NikonConnect-Android-test-signed.apk
          (cd dist && sha256sum NikonConnect-Android-test-signed.apk > NikonConnect-Android-test-signed.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  release:
    needs: [sync, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Prepare release tag
        id: meta
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
        run: |
          short_sha="$(printf '%s' "$UPSTREAM_SHA" | cut -c1-12)"
          echo "tag=upstream-$short_sha" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: master
          name: "NikonConnect Android automated build ${{ steps.meta.outputs.tag }}"
          prerelease: true
          generate_release_notes: false
          body: |
            Unofficial automatic build from LAMYW-code/NikonConnect-Android.
            Built from upstream commit ${{ needs.sync.outputs.upstream_sha }}.
            APK currently uses the project's test/debug signing key. Reinstall may be necessary after the next build.
          files: dist/*
          fail_on_unmatched_files: true
